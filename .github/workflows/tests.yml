name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: web/.python-version
          cache: pip
          cache-dependency-path: web/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check --settings=config.test_settings

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.test_settings

      - name: Run tests
        run: python manage.py test --settings=config.test_settings
