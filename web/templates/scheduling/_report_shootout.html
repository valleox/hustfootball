<h3>{{ label }}</h3>
{{ formset.management_form }}
{{ formset.non_form_errors }}
<div class="table-scroll">
  <table class="row-table shootout-table">
    <thead>
      <tr>
        <th rowspan="2">轮次</th>
        <th colspan="3">主队（{{ home_team }}）</th>
        <th colspan="3">客队（{{ away_team }}）</th>
      </tr>
      <tr>
        <th>号码</th><th>姓名</th><th>结果</th>
        <th>号码</th><th>姓名</th><th>结果</th>
      </tr>
    </thead>
    <tbody data-rows="{{ key }}">
      {% for row in formset %}
        <tr>
          <td class="round" data-label="轮次"></td>
          {% for field in row.visible_fields %}
            <td class="field-{{ field.name }}" data-label="{{ field.label }}">{{ field }}{{ field.errors }}</td>
          {% endfor %}
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
<template data-empty-row="{{ key }}">
  <tr>
    <td class="round" data-label="轮次"></td>
    {% for field in formset.empty_form.visible_fields %}
      <td class="field-{{ field.name }}" data-label="{{ field.label }}">{{ field }}</td>
    {% endfor %}
  </tr>
</template>
<p><button type="button" class="secondary small" data-add-row="{{ key }}">＋ 添加一行</button></p>
